# Pacotes do Estúdio para Linux, Windows e Mac (docs/portes.md). Cada sistema empacota a si mesmo: npm ci, typecheck,
# testes e o MCP; depois o pacote e o instalador da plataforma sobem como artifact da execução (14 dias).
# Roda à mão (Actions › Build › Run workflow), ao subir uma tag v* (git tag v3.1.0 && git push --tags) ou ao subir um branch
# ci/* (git push origin HEAD:ci/<nome>), que serve para validar um branch antes de ele chegar ao main: o "Run workflow"
# só existe para o que já está no branch padrão. Não roda a cada push: em repositório privado o minuto do Mac conta 10
# vezes (custo em docs/portes.md).
#
# Assinatura e notarização do Mac só acontecem quando os secrets existem (Settings › Secrets and variables › Actions):
#   MAC_CERTIFICADO_P12        o certificado "Developer ID Application" exportado do Keychain (.p12), em base64
#   MAC_CERTIFICADO_SENHA      a senha do .p12
#   MAC_IDENTIDADE             (opcional) o nome do certificado; sem ele, o primeiro "Developer ID Application"
#   e, para notarizar, OU a chave da API do App Store Connect:
#   APPLE_API_KEY_P8           o conteúdo do AuthKey_XXXX.p8
#   APPLE_API_KEY_ID, APPLE_API_ISSUER
#   OU o Apple ID: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# Sem eles o .app sai sem assinatura (abre com o "abrir mesmo assim" do docs/portes.md).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['ci/**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacote:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nome: Linux x64, os: ubuntu-latest, alvo: linux, arch: x64}
          - {nome: Windows x64, os: windows-latest, alvo: win, arch: x64}
          # o macos-14 deixou de ser aceito ("configuration 'macos-14-arm64-us-xl' is not supported", 10/11/2026)
          - {nome: Mac Apple Silicon, os: macos-15, alvo: mac, arch: arm64}
          # o macos-13 (Intel) foi aposentado pelo GitHub em dez/2025; o macos-15-intel é a imagem Intel que ficou
          - {nome: Mac Intel, os: macos-15-intel, alvo: mac, arch: x64}
    env:
      TEM_CERTIFICADO_MAC: ${{ secrets.MAC_CERTIFICADO_P12 != '' }}
      TEM_NOTARIZACAO_API: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      TEM_NOTARIZACAO_ID: ${{ secrets.APPLE_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependências
        run: |
          npm ci
          # o npm 11 não roda o script que baixa o Electron; nas outras versões isto não faz nada
          node node_modules/electron/install.js

      # o navegador de render (Chrome Headless Shell, ~140 MB) fica em node_modules/.remotion, que o npm ci apaga
      - name: Navegador de render em cache
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ matrix.alvo }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Tipos
        run: npm run typecheck

      # A suíte passou inteira nos quatro sistemas em 10/11/2026 (execução 42860394514): teste vermelho segura o pacote.
      - name: Testes
        run: npm test

      - name: MCP
        run: npm run mcp:build

      # ---------- Mac: whisper-cli e assinatura ----------
      # o whisper.cpp não publica binário do Mac: compila a versão presa do app (transcricao.ts), estático, e vai para
      # resources/whisper do Estudio.app (ESTUDIO_WHISPER_EMBUTIDO, forge.config.ts)
      - name: whisper-cli (Mac)
        if: matrix.alvo == 'mac'
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            ${{ matrix.arch == 'x64' && '-DGGML_NATIVE=OFF' || '' }}
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" --target whisper-cli -j 4
          cli="$RUNNER_TEMP/whisper.cpp/build/bin/whisper-cli"
          "$cli" --help > /dev/null
          otool -L "$cli"
          echo "ESTUDIO_WHISPER_EMBUTIDO=$cli" >> "$GITHUB_ENV"

      - name: Certificado (Mac)
        if: matrix.alvo == 'mac' && env.TEM_CERTIFICADO_MAC == 'true'
        env:
          MAC_CERTIFICADO_P12: ${{ secrets.MAC_CERTIFICADO_P12 }}
          MAC_CERTIFICADO_SENHA: ${{ secrets.MAC_CERTIFICADO_SENHA }}
          MAC_IDENTIDADE: ${{ secrets.MAC_IDENTIDADE }}
        run: |
          kc="$RUNNER_TEMP/assinatura.keychain-db"
          senha_kc="$(openssl rand -hex 16)"
          security create-keychain -p "$senha_kc" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$senha_kc" "$kc"
          echo "$MAC_CERTIFICADO_P12" | base64 --decode > "$RUNNER_TEMP/certificado.p12"
          security import "$RUNNER_TEMP/certificado.p12" -P "$MAC_CERTIFICADO_SENHA" -A -t cert -f pkcs12 -k "$kc"
          rm -f "$RUNNER_TEMP/certificado.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$senha_kc" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id="${MAC_IDENTIDADE:-$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')}"
          [ -n "$id" ] || { echo "nenhum certificado Developer ID Application no .p12" >&2; exit 1; }
          echo "ESTUDIO_MAC_IDENTIDADE=$id" >> "$GITHUB_ENV"

      - name: Notarização pela chave da API (Mac)
        if: matrix.alvo == 'mac' && env.TEM_CERTIFICADO_MAC == 'true' && env.TEM_NOTARIZACAO_API == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Notarização pelo Apple ID (Mac)
        if: matrix.alvo == 'mac' && env.TEM_CERTIFICADO_MAC == 'true' && env.TEM_NOTARIZACAO_API != 'true' && env.TEM_NOTARIZACAO_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      # ---------- pacote e instalador ----------
      - name: Pacote e zip portátil
        run: |
          case "${{ matrix.alvo }}" in
            linux) plataforma=linux ;;
            win) plataforma=win32 ;;
            mac) plataforma=darwin ;;
          esac
          npx electron-forge package --platform "$plataforma" --arch ${{ matrix.arch }}
          npx electron-forge make --skip-package --platform "$plataforma" --arch ${{ matrix.arch }} --targets @electron-forge/maker-zip

      - name: Instalador NSIS (Windows)
        if: matrix.alvo == 'win'
        run: npx electron-builder --prepackaged out/pacote/Estudio-win32-x64 --win nsis --x64 --publish never

      - name: DMG (Mac)
        if: matrix.alvo == 'mac'
        run: npx electron-builder --prepackaged out/pacote/Estudio-darwin-${{ matrix.arch }}/Estudio.app --mac dmg --${{ matrix.arch }} --publish never

      - name: Conferir a assinatura (Mac)
        if: matrix.alvo == 'mac'
        run: |
          app="out/pacote/Estudio-darwin-${{ matrix.arch }}/Estudio.app"
          codesign -dv --verbose=2 "$app" 2>&1 | head -20 || true
          if [ "$TEM_CERTIFICADO_MAC" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vvv -t exec "$app" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: estudio-${{ matrix.alvo }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            out/pacote/make/zip/**/*.zip
            out/instalador/*.exe
            out/instalador/*.dmg

      - name: Limpar o keychain (Mac)
        if: always() && matrix.alvo == 'mac' && env.TEM_CERTIFICADO_MAC == 'true'
        run: security delete-keychain "$RUNNER_TEMP/assinatura.keychain-db" || true
