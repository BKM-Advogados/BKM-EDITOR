# Instalador do Windows (NSIS), montado sobre o app que o Electron Forge empacota em out/pacote/Estudio-win32-x64:
#   npm run instalador   →   out/instalador/Estudio-Setup-<versão>.exe
# Instala na pasta da pessoa (%LocalAppData%\Programs\Estudio), sem pedir administrador, e cria os atalhos na área de
# trabalho e no menu Iniciar. Troca do Squirrel (5/11/2026): o antivírus da BKM derrubava o executável intermediário dele.
appId: br.com.bkmadvogados.estudio
productName: Estudio
copyright: BKM Advogados
directories:
  output: out/instalador
win:
  icon: build/icone.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Estúdio
  menuCategory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icone.ico
  uninstallerIcon: build/icone.ico
  uninstallDisplayName: Estúdio
  artifactName: Estudio-Setup-${version}.${ext}
  language: '1046'

# DMG do Mac, montado sobre o Estudio.app que o Electron Forge empacota (e, com as variáveis da Apple, assina e notariza:
# build/mac.ts). Só sai num Mac (o hdiutil é da Apple):
#   npm run instalador:mac            →   out/instalador/Estudio-<versão>-<arch>.dmg
# O electron-builder não assina de novo (identity: null): o .app já vem assinado, ou sem assinatura, do Forge.
mac:
  icon: build/icone.icns
  category: public.app-category.video
  identity: null
  target:
    - target: dmg
dmg:
  title: Estúdio ${version}
  artifactName: Estudio-${version}-${arch}.${ext}
